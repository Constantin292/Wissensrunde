name: Attach Wissensrunde updates
on:
  workflow_dispatch:
  push:
    paths:
      - 'updates.js'
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add updates script without replacing game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          content = p.read_text(encoding="utf-8")
          tag = '<script src="./updates.js"></script>'
          if tag not in content:
              if '</body>' not in content:
                  raise SystemExit("Cannot locate closing body tag; no changes made")
              content = content.replace('</body>', tag + '\n</body>', 1)
              p.write_text(content, encoding="utf-8")
          PY
      - name: Commit only when changed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Connect updates.js without replacing game"
            git push
          fi
